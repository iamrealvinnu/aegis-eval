[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ai-eval"
version = "2.0.0"
authors = [
  { name="Vinay Gupta", email="gdinexus@example.com" },
]
description = "Autonomous AI Risk Assessment & Mitigation Framework"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "docker>=7.1.0",
    "mlx>=0.31.0",
    "mlx-lm>=0.21.0",
    "numpy<2.0.0",
    "matplotlib",
]

[project.urls]
"Homepage" = "https://github.com/iamrealvinnu/aegis-eval"
"Bug Tracker" = "https://github.com/iamrealvinnu/aegis-eval/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*"]
